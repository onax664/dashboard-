<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kho game APK</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Material+Symbols+Rounded" rel="stylesheet">
<style>
:root{--bg:#06122a;--ink:#f2f6ff;--mute:#9db3d6;--line:rgba(140,185,255,.28);--glass:rgba(255,255,255,.06);--blue:#5ea8ff;--green:#1fae6a;--amber:#ffb23e;--red:#e11d2e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);background-image:radial-gradient(520px 340px at 50% 0,rgba(52,110,214,.35),transparent 70%),radial-gradient(420px 300px at 100% 60%,rgba(40,80,170,.22),transparent 70%);color:var(--ink);font-family:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:"liga";vertical-align:middle}
.glass{background:var(--glass);border:1.5px solid var(--line);border-radius:26px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.hero{text-align:center;padding-top:8px}
.avatar{width:128px;height:128px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:#0e2147;border:3px solid rgba(120,170,255,.55);box-shadow:0 0 38px rgba(70,130,255,.55);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .ms{font-size:64px;color:#8fb8ff}
.tag{display:inline-block;padding:8px 32px;border-radius:999px;border:2px solid rgba(110,170,255,.7);background:rgba(60,110,200,.25);color:#a9c8ff;font-weight:800;letter-spacing:.28em;font-size:18px;box-shadow:0 0 20px rgba(80,140,255,.35)}
.hi{margin:18px 0 0;color:var(--mute);font-size:22px;font-weight:600}
.name{margin:0;font-size:46px;line-height:1.1;font-weight:800}
.type{margin:12px 0 0;color:var(--mute);font-size:24px;font-weight:700;min-height:36px}
.type i{display:inline-block;width:2px;height:24px;background:var(--mute);vertical-align:-4px;margin-left:3px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 14px}
.soc button{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 6px;border-radius:22px;border:1.5px solid var(--line);background:linear-gradient(160deg,rgba(60,100,170,.45),rgba(20,40,85,.7));color:var(--ink);font:700 17px "Baloo 2",sans-serif;cursor:pointer}
.soc svg{width:22px;height:22px;flex:none}
.shop{display:flex;align-items:center;gap:16px;width:100%;padding:18px;text-align:left;color:var(--ink);font-family:inherit;cursor:pointer;border-radius:26px}
.shop .ic{width:62px;height:62px;border-radius:18px;background:linear-gradient(145deg,#3b82f6,#22a8c8);display:grid;place-items:center;flex:none}
.shop .ic .ms{font-size:34px;color:#7cf0a6}
.shop b{display:block;font-size:24px;line-height:1.1}
.shop span.s{color:var(--mute);font-size:17px;font-weight:600}
.shop>.ms{margin-left:auto;font-size:34px;color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:22px 4px;margin-top:14px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats .ms{font-size:28px}
.stats b{display:block;font-size:22px;font-weight:800;margin-top:6px}
.stats small{color:var(--mute);font-size:14px;font-weight:600}
.sec{margin-top:34px;padding:20px 8px 16px;border-radius:34px;background:rgba(10,24,52,.7);border:1px solid rgba(120,160,230,.12)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;border:1.5px solid var(--line);color:#7db6ff;font-weight:800;letter-spacing:.2em;font-size:18px;margin-left:4px}
.h{display:flex;align-items:center;gap:12px;margin:22px 4px 14px;font-size:36px;font-weight:800}
.h .ms{font-size:38px;color:#3ddc84}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 18px 8px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--glass);color:var(--ink);font:700 17px "Baloo 2",sans-serif;cursor:pointer;margin-bottom:6px}
.card{margin-bottom:16px;border-radius:26px;overflow:hidden;border:1.5px solid rgba(150,200,255,.35);background:linear-gradient(160deg,rgba(60,95,150,.5),rgba(18,34,70,.85));box-shadow:0 8px 24px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;gap:10px;padding:12px}
.gi{width:58px;height:58px;border-radius:16px;flex:none;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.25)}
.gi .ms{font-size:32px;color:#fff}
.gi.has{padding:0;overflow:hidden;background:#000}.gi img{width:100%;height:100%;object-fit:cover;display:block}
.ban{background:#000;border-bottom:1px solid rgba(150,200,255,.25)}.ban img{display:block;width:100%;height:96px;object-fit:contain}
.gi.lq{background:linear-gradient(145deg,#e0a13a,#c2410c)}
.gi.rb{background:linear-gradient(145deg,#ef4444,#7f1d1d)}
.gi.bf{background:linear-gradient(145deg,#3b82f6,#0e7490)}
.gi.egg{background:linear-gradient(145deg,#f5c542,#d97706)}
.info{flex:1;min-width:0}
.info h3{margin:0;font-size:20px;line-height:1.15;font-weight:800}
.up{margin:1px 0 6px;color:var(--mute);font-size:13px;font-weight:600}
.up:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#5cb0ff;margin-right:8px;vertical-align:1px}
.tags{display:flex;gap:5px;flex-wrap:nowrap}
.t{display:inline-flex;align-items:center;gap:3px;padding:1px 8px 1px 5px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap;border:1.5px solid transparent}
.t .ms{font-size:14px}
.t.ios{background:#fff;color:#1b1f2a;border-color:#a9b4cc}.t.ios .ms{color:#5b6b8c}
.t.and{background:#fff;color:#0f2a1a;border-color:#27c46b}
.t.and .ms{color:#27c46b}
.t.bt{background:#fff3d6;color:#7a4a00;border-color:var(--amber)}
.t.bt .ms{color:#d98200}
.t.ok{background:#e4f7ec;color:#0b4a2a;border-color:#27c46b}
.dl{width:54px;height:54px;border-radius:16px;border:0;flex:none;background:linear-gradient(145deg,#22c277,#0e8a50);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 22px rgba(40,200,120,.45)}
.dl .ms{font-size:32px}
.dl.off{background:linear-gradient(145deg,#6b7a96,#46536d);box-shadow:none}
.note{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#f1ece6;color:var(--red);font-weight:800;font-size:17px}
.note .ms{color:#f2a900;font-size:24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:12px 22px;border-radius:999px;background:#fff;color:#12203d;font-weight:800;font-size:17px;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(3,10,24,.85);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
.ov.off{display:none}
.mc{width:100%;max-width:340px;text-align:center;padding:26px 20px 20px;border-radius:28px;background:#0c1c3d;border:1.5px solid var(--line);box-shadow:0 0 40px rgba(60,120,255,.35)}
.disc{width:92px;height:92px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:#13294f;border:2px solid #4d86d9}
.disc .ms{font-size:46px;color:#8fb8ff}
.disc.sp{animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mc h2{margin:0;font-size:24px;font-weight:800}
.mc p{margin:4px 0 18px;color:var(--mute);font-size:16px;font-weight:600}
.mc .go{width:100%;padding:13px;border-radius:999px;border:0;background:#1fae6a;color:#fff;font:800 18px "Baloo 2",sans-serif;cursor:pointer}
.mc .skip{margin-top:10px;background:none;border:0;color:var(--mute);font:700 15px "Baloo 2",sans-serif;cursor:pointer}
.mp{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;max-width:72vw;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(12,28,61,.94);border:1.5px solid var(--line);color:var(--ink);font:700 14px "Baloo 2",sans-serif}
.mp button{width:38px;height:38px;border-radius:50%;border:0;background:#1fae6a;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.mp .ms{font-size:24px}
.mp .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp.hide{display:none}
@media(prefers-reduced-motion:reduce){.disc.sp{animation:none}}
body.lt{background:#eaf1fb;background-image:none;color:#12203d}
#det .back{background:#fff;border-color:#c5d3ec;color:#12203d}
.bn{height:190px;border-radius:26px;position:relative;overflow:hidden;margin-top:6px;background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#3949ab,#8e24aa)}
.bn:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(234,241,251,0) 45%,#eaf1fb 100%)}
.hd{display:flex;align-items:flex-end;gap:14px;margin:-52px 6px 0;position:relative;z-index:2}
.hd .ic{width:104px;height:104px;border-radius:26px;border:3px solid #fff;overflow:hidden;flex:none;background:#000;box-shadow:0 6px 16px rgba(20,40,90,.25)}
.hd .ic img{width:100%;height:100%;object-fit:cover;display:block}
.hd .gn{color:#2f7de1;font-weight:800;font-size:16px;margin-top:6px}
.hd h2{margin:0 0 2px;font-size:32px;line-height:1.1;font-weight:800;color:#12203d}
.hd .dc{color:#51648a;font-size:17px;font-weight:700}
.bt3{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:999px;color:#fff;font:800 20px "Baloo 2",sans-serif;cursor:pointer;margin-top:12px}
.bt3 .ms{font-size:28px}
.wc{background:#fff;border-radius:26px;margin-top:18px;box-shadow:0 6px 0 #c9d6ec;overflow:hidden;color:#12203d}
.wc h3{display:flex;align-items:center;gap:12px;margin:0;padding:18px 20px;font-size:26px;font-weight:800;border-bottom:1.5px solid #e1e8f5}
.wc h3 .ms{color:#4a90d9;font-size:30px}
.gal{padding:14px}
.sl{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;touch-action:pan-y}
.sl .lb{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 40px "Baloo 2",sans-serif;text-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.sl .ar{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;cursor:pointer}
.sl .ar.l{left:10px}.sl .ar.r{right:10px}
.sl .cn{position:absolute;right:10px;bottom:10px;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:16px}
.th{display:flex;gap:10px;overflow-x:auto;margin-top:12px;padding:3px 3px 6px}
.th div{flex:none;width:96px;aspect-ratio:16/9;border-radius:12px;border:3px solid transparent;cursor:pointer}
.th div.on{border-color:#2f7de1}
.ir{display:flex;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1.5px solid #e1e8f5;font-size:18px;font-weight:700}
.ir:last-child{border-bottom:0}
.ir span{color:#33466b}.ir b{color:#12203d;text-align:right;word-break:break-all}
.sp{display:none;margin-top:14px;background:#1b2338;border-radius:22px;padding:18px;color:#fff}
.sph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid #2b3550}
.sph h4{margin:0;font-size:20px;line-height:1.25;font-weight:800}
.kb{flex:none;padding:6px 14px;border-radius:999px;background:#4a3524;color:#f5b13b;font-weight:800;font-size:14px}
.cd{margin:14px 0;padding:14px;border-radius:16px;background:#0a0e1c;color:#9db4e8;font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.cp{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border:0;border-radius:999px;background:linear-gradient(90deg,#6d5bf0,#12b5e0);color:#fff;font:800 18px "Baloo 2",sans-serif;cursor:pointer}
.cp .ms{font-size:22px}
.pg{display:none}.pg.on{display:block}
button:focus-visible{outline:3px solid #8fd0ff;outline-offset:2px}
@media(max-width:380px){.name{font-size:38px}}
@media(prefers-reduced-motion:reduce){.type i{animation:none}.toast{transition:none}}
</style>
</head>

    '<button class="bt3" id="b3" style="background:#dc2626"><span class="ms">play_circle</span>Hướng dẫn tải &amp; GetKey Free</button></div>'+(it.isScr?'<div class="sp" id="sp"><div class="sph"><h4>◆ '+E(it.game||"")+' – '+E(it.title)+'</h4><span class="kb">'+(it.keyless===false?"KEY":"KEYLESS")+'</span></div><pre class="cd" id="scr"></pre><button class="cp" id="cp"><span class="ms">content_copy</span><span id="cpt">Copy</span></button></div>':'')+
    '<div class="wc"><h3><span class="ms">image</span>Xem trước</h3><div class="gal"><div class="sl" id="sl"><span class="lb" id="lb"></span><button class="ar l" id="pv" aria-label="Ảnh trước"><span class="ms">chevron_left</span></button><button class="ar r" id="nx" aria-label="Ảnh sau"><span class="ms">chevron_right</span></button><span class="cn" id="cn"></span></div><div class="th" id="th"></div></div></div>'+
    '<div class="wc"><h3><span class="ms">info</span>Thông tin</h3>'+rows.map(function(r){return '<div class="ir"><span>'+r[0]+'</span><b>'+E(r[1])+'</b></div>'}).join("")+'</div>'+
    '<div style="height:24px"></div>';
  var gi=0,sl=$("sl"),th=$("th");
  SHOTS.forEach(function(v,n){var t=document.createElement("div");t.setAttribute("style",bgOf(v));t.onclick=function(){setG(n)};th.appendChild(t)});
  function setG(n){
    gi=(n+SHOTS.length)%SHOTS.length;var v=SHOTS[gi];
    sl.style.cssText=bgOf(v);
    $("lb").textContent=v.charAt(0)==="#"?"Ảnh "+(gi+1):"";
    $("cn").textContent=(gi+1)+" / "+SHOTS.length;
    Array.prototype.forEach.call(th.children,function(c,k){c.className=k===gi?"on":""});
    var c=th.children[gi];th.scrollLeft=c.offsetLeft-th.clientWidth/2+c.clientWidth/2;
  }
  var x0=0;
  sl.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  sl.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)setG(gi+(dx<0?1:-1))});
  $("pv").onclick=function(){setG(gi-1)};$("nx").onclick=function(){setG(gi+1)};
  $("b1").onclick=function(){
    if(it.status==="bt")return toast(it.title+" đang bảo trì");
    if(!it.isScr)return openUrl(it.url);
    var sp=$("sp"),on=sp.style.display==="block";sp.style.display=on?"none":"block";
    if(!on)sp.scrollIntoView({behavior:"smooth",block:"nearest"});
  };
  if(it.isScr){
    $("scr").textContent=it.script||"-- Chưa có script, hãy thêm script của bạn.";
    $("cp").onclick=function(){
      if(!it.script)return toast("Chưa có script để copy");
      copyTxt(it.script).then(function(){$("cpt").textContent="Đã copy";toast("Đã copy script");setTimeout(function(){$("cpt").textContent="Copy"},1800)}).catch(function(){toast("Không copy được")});
    };
  }
  $("b2").onclick=function(){openUrl(it.key)};
  $("b3").onclick=function(){openUrl(it.guide)};
  $("dbk").onclick=function(){go(it.parentKey)};
  setG(0);pg("det");
}
function show(p){
  CUR=p;
  if(DET[p])return showDet(DET[p]);
  var sub=SUBS[p];
  if(!sub){pg("home");return}
  $("subT").textContent=sub.title||"";var lf=!!sub.leaf;$("subP").style.display=lf?"inline-flex":"none";$("subH").style.display=lf?"none":"flex";$("subL").style.marginTop=lf?"16px":"0";
  $("subI").textContent=sub.os==="ios"?"phone_iphone":"android";$("subI").style.color=sub.os==="ios"?"#e8eefc":"";
  var L=$("subL");L.innerHTML="";
  sub.items.forEach(function(it){L.appendChild(card(it,function(x){
    if(x.sub)return go(x.sub);
    if(x.d)return go(x.id);
    if(x.status==="bt")return toast(x.title+" đang bảo trì");
    openUrl(x.url);
  }))});
  pg("sub");
}
function go(p){try{location.hash=p||""}catch(e){}show(p)}
$("bk").onclick=function(){go((SUBS[CUR]&&SUBS[CUR].back)||"")};
window.addEventListener("hashchange",function(){show(location.hash.slice(1))});
var LS=$("list");
GAMES.forEach(function(g){(g.os==="ios"?$("listIos"):LS).appendChild(card(g,function(x){go(x.sub)}))});
$("nm").textContent=CFG.name;$("tag").textContent=CFG.tag;
$("shopT").textContent=CFG.shop.title;$("shopS").textContent=CFG.shop.sub;
$("s1").textContent=CFG.stats.downloads+"+";$("s2").textContent=CFG.stats.keys+"+";
$("s3").textContent=new Date().getFullYear();$("s4").textContent=new Set(GAMES.map(function(g){return g.title})).size;
if(CFG.avatar){$("av").innerHTML='<img alt="Ảnh đại diện" src="'+CFG.avatar+'">'}
document.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){
  var u=CFG.links[b.getAttribute("data-k")];
  if(!u)return toast("Chưa gắn link");
  var top1=true;try{top1=window.self===window.top}catch(e){top1=false}
  if(top1){location.href=u}else{window.open(u,"_blank","noopener")}
}});
var wi=0,ci=0,del=false;
function tick(){
  var w=CFG.typing[wi];
  ci+=del?-1:1;
  $("ty").textContent=w.slice(0,ci);
  var d=del?45:95;
  if(!del&&ci===w.length){del=true;d=1400}
  else if(del&&ci===0){del=false;wi=(wi+1)%CFG.typing.length;d=300}
  setTimeout(tick,d);
}
tick();
show(location.hash.slice(1));
(function(){
  if(!MUSIC.src)return;
  var a=new Audio(MUSIC.src);a.loop=true;a.preload="auto";
  var ev=["touchend","pointerup","click","keydown","touchmove","wheel","scroll"];
  function off(){ev.forEach(function(e){window.removeEventListener(e,unlock,true)})}
  function unlock(){if(!a.paused)return off();a.play().then(off).catch(function(){})}
  a.addEventListener("error",off);
  a.play().catch(function(){ev.forEach(function(e){window.addEventListener(e,unlock,true)})});
})();
</script>
